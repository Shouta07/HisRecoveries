name: Collect Metrics

on:
  schedule:
    # 毎朝 09:00 JST = 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install python-dotenv gspread

      - name: Collect post metrics
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-2.0-flash"
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_KEYWORD_SEARCH_APPROVED: ${{ secrets.THREADS_KEYWORD_SEARCH_APPROVED }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
        run: |
          # 過去投稿(手動分含む)をAPIから取り込み → 既存投稿の数値を更新
          python -m core.main import-history mens-body-lab --max-pages 5 || true
          python -m core.main collect mens-body-lab --days 3

      - name: Save results
        if: success()
        run: |
          git config user.name "hisrecoveries-bot"
          git config user.email "hisrecoveries-bot@users.noreply.github.com"
          git add accounts/*/history.json data/ || true
          git diff --cached --quiet || git commit -m "auto: collect metrics [skip ci]"
          git push || true

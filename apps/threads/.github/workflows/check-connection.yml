name: Check Threads Connection

# Threads APIに繋がるか診断する（手動実行）。
# Actions → Check Threads Connection → Run workflow で、
# トークン・アカウント・スコープの状態がログに出る。投稿はしない。

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install python-dotenv gspread
      - name: Check connection
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
        run: python -m core.main check-connection mens-body-lab

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="このサイトについて">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B1610"/>
      <stop offset="100%" stop-color="#0E0C09"/>
    </linearGradient>
    <radialGradient id="warmth" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1B1610" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vignette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8DCBF" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#E8DCBF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#E8DCBF" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#warmth)"/>

  <!-- A manuscript page block, slightly tilted feel via offsets -->
  <g stroke="#E8DCBF" stroke-opacity="0.35">
    <line x1="430" y1="280" x2="1300" y2="280" stroke-width="0.7"/>
    <line x1="430" y1="370" x2="1180" y2="370" stroke-width="0.7"/>
    <line x1="430" y1="460" x2="1230" y2="460" stroke-width="0.7"/>
    <line x1="430" y1="550" x2="1140" y2="550" stroke-width="0.7"/>
    <line x1="430" y1="640" x2="1050" y2="640" stroke-width="0.7"/>
    <line x1="430" y1="730" x2="970"  y2="730" stroke-width="0.7"/>
  </g>

  <!-- A second column of fragmented lines (suggesting a draft) -->
  <g stroke="#D9B584" stroke-opacity="0.55">
    <line x1="430" y1="305" x2="900" y2="305" stroke-width="0.6"/>
    <line x1="430" y1="395" x2="780" y2="395" stroke-width="0.6"/>
    <line x1="430" y1="485" x2="850" y2="485" stroke-width="0.6"/>
    <line x1="430" y1="575" x2="720" y2="575" stroke-width="0.6"/>
  </g>

  <!-- Two accent dots — like the period of a sentence and a footnote mark -->
  <circle cx="970" cy="730" r="5" fill="#D9B584"/>
  <circle cx="430" cy="800" r="3" fill="#E8DCBF" fill-opacity="0.5"/>

  <!-- A large background "I." like an illuminated drop cap -->
  <text x="120" y="780" font-family="Cormorant Garamond, Times, serif" font-size="280" letter-spacing="6" fill="#D9B584" fill-opacity="0.18">I.</text>

  <!-- A page-corner fold motif -->
  <path d="M1500 880 L1500 940 L1440 940 Z" fill="#E8DCBF" fill-opacity="0.10"/>
  <path d="M1500 880 L1440 940" stroke="#D9B584" stroke-width="0.7" stroke-opacity="0.6"/>

  <rect width="1600" height="1000" fill="url(#vignette)"/>
</svg>

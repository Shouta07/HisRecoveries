<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A Quiet Gathering — Quiet Grooming">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFAF7"/>
      <stop offset="100%" stop-color="#F1E9DB"/>
    </linearGradient>
    <radialGradient id="warmth" cx="78%" cy="22%" r="65%">
      <stop offset="0%" stop-color="#F4E6CD" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FAFAF7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow" cx="20%" cy="92%" r="45%">
      <stop offset="0%" stop-color="#1A1A1A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1A1A1A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#warmth)"/>
  <rect width="1600" height="1000" fill="url(#shadow)"/>

  <!-- Soft mirror metaphor: nested rings, off-center -->
  <g transform="translate(1120 440)" fill="none" stroke="#8B7355">
    <circle r="320" stroke-width="0.7" stroke-opacity="0.22"/>
    <circle r="240" stroke-width="0.6" stroke-opacity="0.30"/>
    <circle r="160" stroke-width="0.5" stroke-opacity="0.38"/>
    <circle r="90"  stroke-width="0.4" stroke-opacity="0.45"/>
  </g>

  <!-- Long vertical thread (suggesting a vanity column) -->
  <line x1="490" y1="120" x2="490" y2="900" stroke="#8B7355" stroke-width="0.6" stroke-opacity="0.35"/>

  <!-- Golden ratio horizontal bar -->
  <rect x="780" y="618" width="640" height="1.5" fill="#8B7355" fill-opacity="0.55"/>

  <!-- Eyebrow -->
  <text x="80" y="120" font-family="Cormorant Garamond, Times, serif" font-size="22" letter-spacing="6" fill="#6B6B6B">A QUIET GATHERING</text>

  <!-- Subscript / signature -->
  <text x="80" y="918" font-family="Cormorant Garamond, Times, serif" font-size="22" letter-spacing="4" fill="#8B7355">— Tokyo · 2026</text>
  <text x="1520" y="918" font-family="Cormorant Garamond, Times, serif" font-size="22" letter-spacing="4" fill="#8B7355" text-anchor="end">His Recoveries</text>

  <!-- Center serif accent -->
  <text x="800" y="540" font-family="Cormorant Garamond, Times, serif" font-style="italic" font-size="38" fill="#1A1A1A" fill-opacity="0.55" text-anchor="middle">Observed — not proclaimed.</text>
</svg>

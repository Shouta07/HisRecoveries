name: Deploy to Vercel (Production)

# main への push（や手動実行）で、本番へ確実にデプロイする。
# Vercel の自動 Git 連携が効かない場合のフェイルセーフ。
#
# 必要なリポジトリ Secret（Settings → Secrets and variables → Actions）:
#   VERCEL_TOKEN       … Vercel → Account Settings → Tokens で作成
#   VERCEL_ORG_ID      … `vercel link` で生成される .vercel/project.json の orgId
#   VERCEL_PROJECT_ID  … 同 projectId（または Project Settings → General）

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy (production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

name: Threads Post (generate → queue)

# monorepo のルートに置く稼働ワークフロー。実体は apps/threads。
# 通常運用は Gemini 生成 → 承認ゲートにより approvals.json へ積むだけ（投稿しない）。
# 実投稿は threads-post-approved.yml が承認済みを拾って行う。

on:
  schedule:
    - cron: "0 0 * * *"   # 09:00 JST
    - cron: "0 12 * * *"  # 21:00 JST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no actual post)"
        default: false
        type: boolean
      mock:
        description: "Mock mode (use template, no AI)"
        default: false
        type: boolean

permissions:
  contents: write

defaults:
  run:
    working-directory: apps/threads

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: threads-post
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install python-dotenv gspread

      - name: Check KILL_SWITCH
        run: |
          if [ -f KILL_SWITCH ]; then
            echo "::warning::KILL_SWITCH is active. Skipping post."
            exit 0
          fi

      - name: Sync from spreadsheet (pull)
        continue-on-error: true
        env:
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
        run: python -m core.main sheets-sync pull mens-body-lab || true

      - name: Generate (Gemini) → approval queue
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-2.0-flash"
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_KEYWORD_SEARCH_APPROVED: ${{ secrets.THREADS_KEYWORD_SEARCH_APPROVED }}
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          if [ "${{ inputs.mock }}" = "true" ]; then FLAGS="$FLAGS --mock"; fi
          # 通常運用は --mock なし＝Gemini生成。承認ゲートONのため投稿はされない。
          python -m core.main post mens-body-lab $FLAGS

      - name: Save queue + history
        if: success()
        run: |
          git config user.name "hisrecoveries-bot"
          git config user.email "hisrecoveries-bot@users.noreply.github.com"
          git add accounts/*/history.json accounts/*/experiments.json \
                  accounts/*/thread_templates.json accounts/*/content_sources.json \
                  accounts/*/hypotheses.json accounts/*/persona.json \
                  accounts/*/approvals.json data/ || true
          git diff --cached --quiet || git commit -m "auto: generate + queue [skip ci]"
          git push || true
